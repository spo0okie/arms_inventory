actor: AcceptanceExtraTester
modules:
    enabled:
        - Yii2:
            part: [ orm, fixtures ]
            configFile: 'config/test-web.php'
            transaction: false
            cleanup: false
            entryUrl: '%TEST_ENTRY_URL%'
        - PhpBrowser:
            url: '%TEST_ENTRY_URL%'
        - REST:
            depends: PhpBrowser
            url: '%TEST_SERVER_URL%'
bootstrap: _bootstrap.php