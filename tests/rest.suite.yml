actor: ApiTester
modules:
    enabled:
        - Yii2:
              part: [ orm, fixtures ]
              configFile: 'config/test-web.php'
              transaction: false
              cleanup: false
              entryUrl: '%TEST_ENTRY_URL%'
        - REST:
              depends: PhpBrowser
              url: '%TEST_ENTRY_URL%/api'
        - \Helper\Rest
bootstrap: _bootstrap.php