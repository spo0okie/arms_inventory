<VirtualHost *:8088>
  <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
  </FilesMatch>
  ## Vhost docroot
  DocumentRoot "/var/www/arms"

  ## Directories, there should at least be a declaration for /var/www/arms

  <Directory "/var/www/arms">
    Options -Indexes +Includes
    AllowOverride All
    Require all granted
  </Directory>

  ## Logging
  ErrorLog "/var/log/apache2/inventory.http_error.log"
  ServerSignature Off
  ## combined + время обработки запроса в микросекундах ("%Dus" в конце строки).
  ## На формат завязаны отчёт `yii perf/report` и Zabbix-триггер по 5xx
  ## (docs/help/admin/monitoring.md) - менять только вместе с ними.
  LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %Dus" combined_time
  CustomLog "/var/log/apache2/inventory.http_access.log" combined_time

  ## Header rules
  ## as per http://httpd.apache.org/docs/2.4/mod/mod_headers.html#header
  Header set Access-Control-Allow-Origin "*"
  ## Rewrite rules
  RewriteEngine On
</VirtualHost>
